name: CI

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "vendor/**"
      - ".claude/**"

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Build only. Tests run locally in the ship gate (Dev-Launcher/scripts/gate.sh)
# before every PR; this catches a broken build from any session, cloud
# included, for about a minute of the free plan's Actions minutes.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
